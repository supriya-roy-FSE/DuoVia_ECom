<header class="site-header">
  <div class="brand-strip">
    <a class="brand" routerLink="/" aria-label="DuoVia Styles home">
      <img
        class="brand-logo"
        [src]="logoPath"
        alt="DuoVia Styles logo"
        width="200"
        height="56"
      />
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <a routerLink="/" class="nav-link">Home</a>

      @if (currentUser()) {
        <a routerLink="/wishlist" class="nav-link">Wishlist</a>
        <a routerLink="/cart" class="nav-link">Cart</a>
        <a routerLink="/my-orders" class="nav-link">My Orders</a>
      }

      <a routerLink="/admin/login" class="nav-link admin-link">Admin</a>
    </nav>

    <div class="user-actions">
      @if (currentUser()) {
        <div class="user-badge">
          <span>Hi, {{ currentUser()?.name }}</span>
        </div>
        <button type="button" class="logout-btn" (click)="logout()">Logout</button>

        <button type="button" class="wishlist-btn" aria-label="View wishlist" routerLink="/wishlist">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 20.5s-7.5-4.6-10-9.2C.5 8 1.8 4.5 5.1 3.4 7.4 2.6 9.8 3.4 12 5.7c2.2-2.3 4.6-3.1 6.9-2.3 3.3 1.1 4.6 4.6 3.1 7.9-2.5 4.6-10 9.2-10 9.2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
          </svg>
          @if (wishlistCount() > 0) {
            <span class="wishlist-badge">{{ wishlistCount() }}</span>
          }
        </button>

        <button type="button" class="cart-pill" aria-label="View cart" routerLink="/cart">
          Cart
          @if (cartCount() > 0) {
            <span class="cart-badge">{{ cartCount() }}</span>
          }
        </button>
      } @else {
        <a routerLink="/login" class="login-btn">Login</a>
      }
    </div>
  </div>
</header>
