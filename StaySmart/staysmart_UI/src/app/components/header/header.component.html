<header class="site-header">
  <div class="brand-strip">
    <a class="brand" routerLink="/" aria-label="DuoVia Styles home">
      <img
        class="brand-logo"
        [src]="logoPath"
        alt="DuoVia Styles logo"
        width="200"
        height="56"
      />
    </a>

    <nav class="main-nav" aria-label="Main navigation">
      <a routerLink="/" class="nav-link">Home</a>

      <a routerLink="/admin/login" class="nav-link admin-link">Admin</a>
    </nav>

    <div class="user-actions">
      @if (currentUser()) {
        <div class="user-menu-wrap" (clickOutside)="closeUserMenu()">
          <button type="button" class="user-badge" (click)="toggleUserMenu()" aria-expanded="{{ userMenuOpen }}" aria-haspopup="menu">
            <span>Hi, {{ currentUser()?.name }}</span>
            <span class="caret">▾</span>
          </button>

          @if (userMenuOpen) {
            <div class="user-menu" role="menu" aria-label="User menu">
              <button type="button" class="user-menu-item" routerLink="/my-orders" (click)="closeUserMenu()">Order</button>
              <button type="button" class="user-menu-item" routerLink="/wishlist" (click)="closeUserMenu()">Wishlist</button>
              <button type="button" class="user-menu-item" routerLink="/cart" (click)="closeUserMenu()">Cart</button>
              <button type="button" class="user-menu-item muted" (click)="closeUserMenu()">More</button>
              <button type="button" class="user-menu-item danger" (click)="logout()">Logout</button>
            </div>
          }
        </div>
      } @else {
        <a routerLink="/login" class="login-btn">Login</a>
      }
    </div>
  </div>
</header>
